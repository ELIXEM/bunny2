<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Králiček & Panda & Medvídek 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
  body {
    margin: 0;
    background: radial-gradient(circle at top, #ffe6f7 0%, #ffd1f0 40%, #ffc6e5 70%, #ffb3dd 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: "Comic Sans MS", system-ui;
  }
  canvas {
    border: 8px solid #ff9ad5;
    border-radius: 24px;
    box-shadow: 0 0 35px rgba(255, 150, 200, 0.8);
    width: 100vw;
    height: 100vh;
    touch-action: none;
    background: linear-gradient(#c9f0ff, #ffe9f7);
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #ff4f9a;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 0 8px rgba(255, 150, 200, 0.6);
    pointer-events: none;
  }
  #shopBtn, #achBtn, #questBtn {
    position: absolute;
    top: 10px;
    background: #ff9ad5;
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 18px;
    color: white;
    box-shadow: 0 0 10px rgba(255,150,200,0.6);
    cursor: pointer;
  }
  #shopBtn { right: 10px; }
  #achBtn { right: 10px; top: 60px; }
  #questBtn { right: 10px; top: 110px; }

  #shop, #achBox, #questBox {
    display:none;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:20px;
    border-radius:20px;
    width:320px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
    z-index: 10;
  }
  #shop h2, #achBox h2, #questBox h2 {
    margin-top:0;
    color:#ff4f9a;
  }
  .skinItem {
    margin:10px 0;
    padding:10px;
    border-radius:12px;
    background:#ffe6f7;
  }
  .skinItem button {
    margin-top:5px;
    padding:8px 15px;
    border:none;
    background:#ff9ad5;
    color:white;
    border-radius:10px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div id="ui">Score: <span id="score">0</span></div>
<button id="shopBtn">Shop</button>
<button id="achBtn">Achievements</button>
<button id="questBtn">Quests</button>

<div id="shop">
  <h2>Skins</h2>
  <div id="skinList"></div>
  <button id="closeShop">Zavřít</button>
</div>

<div id="achBox">
  <h2>Achievements</h2>
  <div id="achList"></div>
  <button id="closeAch">Zavřít</button>
</div>

<div id="questBox">
  <h2>Quests</h2>
  <div id="questList"></div>
  <button id="closeQuest">Zavřít</button>
</div>

<div id="bigMessageOverlay" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
">
  <div id="bigMessageBox" style="
    background:radial-gradient(circle at top, #ffe6f7 0%, #ffb3dd 40%, #ff9ad5 80%);
    border-radius:30px;
    padding:30px 24px;
    width:80%;
    max-width:420px;
    text-align:center;
    box-shadow:0 0 40px rgba(255,150,200,0.9);
    color:white;
    font-family:'Comic Sans MS', system-ui;
  ">
    <div id="bigMessageEmoji" style="font-size:48px; margin-bottom:10px;">💖</div>
    <div id="bigMessageText" style="font-size:22px; line-height:1.4; white-space:pre-line;"></div>
    <button id="bigMessageClose" style="
      margin-top:20px;
      padding:10px 20px;
      border:none;
      border-radius:20px;
      background:white;
      color:#ff4f9a;
      font-size:18px;
      cursor:pointer;
    ">OK 💕</button>
  </div>
</div>

<canvas id="game"></canvas>

<script>
// === canvas setup ===
const canvas = document.getElementById("game");
canvas.width = 540;
canvas.height = 960;
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

// === BIG MESSAGE OVERLAY ===
const bigOverlay = document.getElementById("bigMessageOverlay");
const bigText = document.getElementById("bigMessageText");
const bigEmoji = document.getElementById("bigMessageEmoji");
const bigClose = document.getElementById("bigMessageClose");

function showBigMessage(text, emoji = "💖") {
  bigText.textContent = text;
  bigEmoji.textContent = emoji;
  bigOverlay.style.display = "flex";
}
bigClose.onclick = () => {
  bigOverlay.style.display = "none";
};

// === SCORE (s uložením) ===
let score = Number(localStorage.getItem("bunny_score")) || 0;
const scoreEl = document.getElementById("score");
scoreEl.textContent = score;

// === SKINS ===
const skins = [
  { id: "default", name: "Králiček (ovoce)", price: 0 },
  { id: "panda", name: "Panda (chytá srdíčka)", price: 50 },
  { id: "bear", name: "Medvídek (chytá med)", price: 80 },
  { id: "valentine", name: "Valentýnský králíček", price: 120 }
];

let selectedSkin = localStorage.getItem("bunny_skin") || "default";
let backgroundMode = "default";

// barvy postavy
let bodyColor = "#fff7fb";
let accentColor = "#ff9ad5";

// === ITEMS (předměty) ===
let itemTypes = [
  {color: "#ff6b6b", leaf: "#2ecc71"}, // ovoce
  {color: "#ffd93b", leaf: "#a3e635"},
  {color: "#9bff7b", leaf: "#4ade80"}
];

const items = [];

// === RABBIT/PANDA/BEAR ===
const rabbit = {
  x: W / 2,
  y: H - 140,
  w: 140,
  h: 120,
  anim: 0,
  joy: 0
};

// === APPLY SKIN ===
function applySkin() {
  bodyColor = "#fff7fb";
  accentColor = "#ff9ad5";
  itemTypes.splice(0, itemTypes.length,
    {color: "#ff6b6b", leaf: "#2ecc71"},
    {color: "#ffd93b", leaf: "#a3e635"},
    {color: "#9bff7b", leaf: "#4ade80"}
  );
  backgroundMode = "default";

  if (selectedSkin === "panda") {
    bodyColor = "#ffffff";
    accentColor = "#000000";
    itemTypes.splice(0, itemTypes.length,
      {color: "#ff4f9a", leaf: "#ffb3d6"} // srdíčka
    );
    backgroundMode = "panda";
  }

  if (selectedSkin === "bear") {
    bodyColor = "#f7d08a";
    accentColor = "#c78b3a";
    itemTypes.splice(0, itemTypes.length,
      {color: "#ffcc33", leaf: "#e6a800"} // med
    );
    backgroundMode = "bear";
  }

  if (selectedSkin === "valentine") {
    bodyColor = "#ffe6f7";
    accentColor = "#ff7fb8";
    itemTypes.splice(0, itemTypes.length,
      {color: "#ff9ad5", leaf: "#ff4f9a"} // valentýnské dopisy
    );
    backgroundMode = "valentine";
  }
}
applySkin();

// === SHOP UI ===
const shopBtn = document.getElementById("shopBtn");
const shopDiv = document.getElementById("shop");
const skinListDiv = document.getElementById("skinList");
const closeShopBtn = document.getElementById("closeShop");

shopBtn.onclick = () => {
  shopDiv.style.display = "block";
  loadShop();
};
closeShopBtn.onclick = () => {
  shopDiv.style.display = "none";
};

function loadShop() {
  skinListDiv.innerHTML = "";
  skins.forEach(skin => {
    const owned = localStorage.getItem("bunny_owned_" + skin.id);
    const div = document.createElement("div");
    div.className = "skinItem";

    div.innerHTML = `
      <strong>${skin.name}</strong><br>
      Cena: ${skin.price}<br>
      ${owned ? "<em>Zakoupeno ✔</em><br>" : ""}
    `;

    const btn = document.createElement("button");
    btn.textContent = owned ? "Vybrat" : "Koupit";

    btn.onclick = () => {
      if (!owned) {
        if (score >= skin.price) {
          score -= skin.price;
          scoreEl.textContent = score;
          localStorage.setItem("bunny_score", score);
          localStorage.setItem("bunny_owned_" + skin.id, "true");
        } else {
          alert("Nemáš dost score!");
          return;
        }
      }
      selectedSkin = skin.id;
      localStorage.setItem("bunny_skin", skin.id);
      applySkin();
      alert("Skin vybrán!");
      loadShop();
    };

    div.appendChild(btn);
    skinListDiv.appendChild(div);
  });
}

// === ACHIEVEMENTS ===
const achievements = [
  { id: "panda20", name: "Panda Love ❤️", desc: "Chyť 20 srdíček jako panda", done: false },
  { id: "bear20", name: "Honey Master 🍯", desc: "Chyť 20 kapek medu jako medvídek", done: false },
  { id: "val20", name: "Valentine Hero 💌", desc: "Chyť 20 dopisů", done: false },
  { id: "fruit50", name: "Fruit Collector 🍓", desc: "Chyť 50 ovoce", done: false },
  { id: "score100", name: "Score 100 ⭐", desc: "Dosáhni skóre 100", done: false },
  { id: "score500", name: "Score 500 ⭐", desc: "Dosáhni skóre 500", done: false },
  { id: "score1000", name: "Score 1000 ⭐", desc: "Dosáhni skóre 1000", done: false },
  { id: "score10000", name: "Special Love ❤️", desc: "Skrytý achievement", done: false } // nebude v UI
];

achievements.forEach(a => {
  if (localStorage.getItem("ach_" + a.id)) {
    a.done = true;
  }
});

const achBtn = document.getElementById("achBtn");
const achBox = document.getElementById("achBox");
const achList = document.getElementById("achList");
const closeAch = document.getElementById("closeAch");

achBtn.onclick = () => {
  achBox.style.display = "block";
  loadAchievements();
};
closeAch.onclick = () => {
  achBox.style.display = "none";
};

function loadAchievements() {
  achList.innerHTML = "";
  achievements.forEach(a => {
    if (a.id === "score10000") return; // skrytý
    const div = document.createElement("div");
    div.style.margin = "10px 0";
    div.style.padding = "10px";
    div.style.borderRadius = "12px";
    div.style.background = a.done ? "#c8ffcf" : "#ffe6f7";

    div.innerHTML = `
      <strong>${a.name}</strong><br>
      <small>${a.desc}</small><br>
      ${a.done ? "<em>Splněno ✔</em>" : "<em>Nesplněno</em>"}
    `;
    achList.appendChild(div);
  });
}

let pandaCount = 0;
let bearCount = 0;
let valCount = 0;
let fruitCount = 0;

function unlock(id) {
  const a = achievements.find(x => x.id === id);
  if (!a || a.done) return;

  a.done = true;
  localStorage.setItem("ach_" + id, "true");

  if (id === "score10000") {
    showBigMessage(
      "Nečekal jsem, že tě to tak chytne a bude bavit.\nMoc si toho vážím.\nJsi úžasná.",
      "💖"
    );
    return;
  }

  alert("🎉 Achievement unlocked: " + a.name);
}

// === QUESTS ===
const questBtn = document.getElementById("questBtn");
const questBox = document.getElementById("questBox");
const questList = document.getElementById("questList");
const closeQuest = document.getElementById("closeQuest");

questBtn.onclick = () => {
  questBox.style.display = "block";
  renderQuests();
};
closeQuest.onclick = () => {
  questBox.style.display = "none";
};

let questPool = [];
let currentQuests = [];
let lastQuestTime = Number(localStorage.getItem("quest_last_time")) || 0;

// vytvoření ~200 jednoduchých questů
function buildQuestPool() {
  const types = ["fruit", "heart", "honey", "letter", "any", "score"];
  for (let i = 0; i < 200; i++) {
    const t = types[i % types.length];
    let target = 10 + (i % 5) * 10; // 10,20,30,40,50
    let reward = 10 + (i % 4) * 10; // 10–40
    let desc = "";

    if (t === "fruit") desc = `Chyť ${target} ovoce 🍓`;
    if (t === "heart") desc = `Chyť ${target} srdíček ❤️ (panda)`;
    if (t === "honey") desc = `Chyť ${target} medu 🍯 (medvídek)`;
    if (t === "letter") desc = `Chyť ${target} dopisů 💌 (valentýnský)`;
    if (t === "any") desc = `Chyť ${target} předmětů 🎁`;
    if (t === "score") {
      target = 100 + (i % 5) * 100; // 100–500
      desc = `Dosáhni skóre ${target} ⭐`;
    }

    questPool.push({
      id: "q" + i,
      type: t,
      target,
      reward,
      desc,
      progress: 0,
      done: false
    });
  }
}

function pickNewQuests() {
  currentQuests = [];
  const used = new Set();
  while (currentQuests.length < 3 && currentQuests.length < questPool.length) {
    const idx = Math.floor(Math.random() * questPool.length);
    if (used.has(idx)) continue;
    used.add(idx);
    const q = Object.assign({}, questPool[idx]);
    q.progress = 0;
    q.done = false;
    currentQuests.push(q);
  }
  localStorage.setItem("current_quests", JSON.stringify(currentQuests));
  localStorage.setItem("quest_last_time", Date.now());
}

function ensureQuests() {
  const now = Date.now();
  const hour = 60 * 60 * 1000;
  if (!lastQuestTime || now - lastQuestTime > hour || currentQuests.length === 0) {
    pickNewQuests();
  } else {
    const saved = localStorage.getItem("current_quests");
    if (saved) {
      try {
        currentQuests = JSON.parse(saved);
      } catch {
        pickNewQuests();
      }
    } else {
      pickNewQuests();
    }
  }
}

function renderQuests() {
  questList.innerHTML = "";
  currentQuests.forEach(q => {
    const div = document.createElement("div");
    div.style.margin = "10px 0";
    div.style.padding = "10px";
    div.style.borderRadius = "12px";
    div.style.background = q.done ? "#c8ffcf" : "#ffe6f7";

    const prog = q.type === "score"
      ? Math.min(score, q.target)
      : Math.min(q.progress, q.target);

    div.innerHTML = `
      <strong>${q.desc}</strong><br>
      <small>Progres: ${prog}/${q.target}</small><br>
      <small>Odměna: +${q.reward} score</small><br>
      ${q.done ? "<em>Splněno ✔</em>" : "<em>Nesplněno</em>"}
    `;
    questList.appendChild(div);
  });
}

function checkQuestCompletion() {
  if (currentQuests.length === 0) return;
  if (currentQuests.every(q => q.done)) {
    showBigMessage("GOOD GIRL 💖", "🌸");
    score += 100;
    scoreEl.textContent = score;
    localStorage.setItem("bunny_score", score);
  }
}

// === TOUCH CONTROL (smooth) ===
let targetX = rabbit.x;
let lastTouch = 0;

function handleTouch(evt) {
  const now = performance.now();
  if (now - lastTouch < 16) return; // ~60 FPS
  lastTouch = now;

  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const touch = evt.touches[0];
  targetX = (touch.clientX - rect.left) * scaleX;
}
canvas.addEventListener("touchstart", handleTouch, {passive: true});
canvas.addEventListener("touchmove", handleTouch, {passive: true});

// === KEYBOARD CONTROL (W, S, A, D) — PC TEST MODE ===
document.addEventListener("keydown", (e) => {
  const speed = 15;
  if (e.key === "a" || e.key === "A") rabbit.x -= speed;
  if (e.key === "d" || e.key === "D") rabbit.x += speed;
  if (e.key === "w" || e.key === "W") rabbit.y -= speed;
  if (e.key === "s" || e.key === "S") rabbit.y += speed;

  rabbit.x = Math.max(rabbit.w / 2, Math.min(W - rabbit.w / 2, rabbit.x));
  rabbit.y = Math.max(rabbit.h / 2, Math.min(H - rabbit.h / 2, rabbit.y));
});

// === SPAWN ITEM ===
function spawnItem() {
  const type = itemTypes[Math.floor(Math.random() * itemTypes.length)];
  items.push({
    x: Math.random() * (W - 40) + 20,
    y: -40,
    r: 30,
    color: type.color,
    leaf: type.leaf,
    vy: 1.2 + Math.random() * 0.6,
    wobble: Math.random() * Math.PI * 2
  });
}

// === UPDATE RABBIT ===
function updateRabbit() {
  rabbit.anim += 0.05;
  if (rabbit.joy > 0) rabbit.joy -= 0.05;

  rabbit.x += (targetX - rabbit.x) * 0.25;
  rabbit.x = Math.max(rabbit.w / 2, Math.min(W - rabbit.w / 2, rabbit.x));
}

// === UPDATE ITEMS ===
function updateItems() {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy;
    it.wobble += 0.07;

    if (
      it.y + it.r > rabbit.y - rabbit.h / 2 &&
      it.x > rabbit.x - rabbit.w / 2 &&
      it.x < rabbit.x + rabbit.w / 2
    ) {
      score++;
      scoreEl.textContent = score;
      rabbit.joy = 1;
      localStorage.setItem("bunny_score", score);

      // počítání pro achievements
      if (selectedSkin === "panda") pandaCount++;
      if (selectedSkin === "bear") bearCount++;
      if (selectedSkin === "valentine") valCount++;
      if (selectedSkin === "default") fruitCount++;

      if (pandaCount >= 20) unlock("panda20");
      if (bearCount >= 20) unlock("bear20");
      if (valCount >= 20) unlock("val20");
      if (fruitCount >= 50) unlock("fruit50");
      if (score >= 100) unlock("score100");
      if (score >= 500) unlock("score500");
      if (score >= 1000) unlock("score1000");
      if (score >= 10000) unlock("score10000");

      // QUEST PROGRES – FIX
      currentQuests.forEach(q => {
        if (q.done) return;

        // SCORE QUEST – jen když skóre přesně dosáhne cíle
        if (q.type === "score") {
          if (score === q.target) {
            q.done = true;
            score += q.reward;
            scoreEl.textContent = score;
            localStorage.setItem("bunny_score", score);
          }
          return;
        }

        // ITEM QUESTS
        let match = false;

        if (q.type === "fruit" && selectedSkin === "default") match = true;
        if (q.type === "heart" && selectedSkin === "panda") match = true;
        if (q.type === "honey" && selectedSkin === "bear") match = true;
        if (q.type === "letter" && selectedSkin === "valentine") match = true;
        if (q.type === "any") match = true;

        if (match) {
          q.progress++;
          if (q.progress >= q.target) {
            q.done = true;
            score += q.reward;
            scoreEl.textContent = score;
            localStorage.setItem("bunny_score", score);
          }
        }
      });

      localStorage.setItem("current_quests", JSON.stringify(currentQuests));
      checkQuestCompletion();

      items.splice(i, 1);
      continue;
    }

    if (it.y - it.r > H) {
      items.splice(i, 1);
    }
  }
}

// === BACKGROUND HELPERS ===
function drawFloatingHearts() {
  ctx.fillStyle = "rgba(255,127,184,0.5)";
  for (let i = 0; i < 6; i++) {
    const x = (i * 90 + (Date.now()/50)%90) % W;
    const y = 80 + i * 60;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.bezierCurveTo(x - 10, y - 10, x - 20, y, x - 20, y + 10);
    ctx.bezierCurveTo(x - 20, y + 20, x, y + 25, x, y + 35);
    ctx.bezierCurveTo(x, y + 25, x + 20, y + 20, x + 20, y + 10);
    ctx.bezierCurveTo(x + 20, y, x + 10, y - 10, x, y);
    ctx.fill();
  }
}
function drawHoneyDrops() {
  ctx.fillStyle = "rgba(255,204,51,0.5)";
  for (let i = 0; i < 6; i++) {
    const x = (i * 80 + (Date.now()/60)%80) % W;
    const y = 60 + i * 70;
    ctx.beginPath();
    ctx.ellipse(x, y, 10, 18, 0, 0, Math.PI*2);
    ctx.fill();
  }
}
function drawLoveLetters() {
  ctx.fillStyle = "rgba(255,154,213,0.6)";
  for (let i = 0; i < 5; i++) {
    const x = (i * 100 + (Date.now()/70)%100) % W;
    const y = 70 + i * 80;
    ctx.beginPath();
    ctx.roundRect(x-18, y-12, 36, 24, 6);
    ctx.fill();
    ctx.fillStyle = "#ff4f9a";
    ctx.beginPath();
    ctx.moveTo(x, y-2);
    ctx.bezierCurveTo(x-6, y-8, x-12, y, x, y+6);
    ctx.bezierCurveTo(x+12, y, x+6, y-8, x, y-2);
    ctx.fill();
    ctx.fillStyle = "rgba(255,154,213,0.6)";
  }
}

// === BACKGROUND ===
function drawBackground() {
  if (backgroundMode === "default") {
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, "#c9f0ff");
    skyGrad.addColorStop(1, "#ffe9f7");
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);
  }
  if (backgroundMode === "panda") {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, "#ffe6f7");
    g.addColorStop(1, "#ffd1f0");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    drawFloatingHearts();
  }
  if (backgroundMode === "bear") {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, "#fff4c2");
    g.addColorStop(1, "#f7d08a");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    drawHoneyDrops();
  }
  if (backgroundMode === "valentine") {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, "#ffe6f7");
    g.addColorStop(0.5, "#ffd1f0");
    g.addColorStop(1, "#ffc6e5");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    drawLoveLetters();
  }
}

// === CHARACTER DRAW ===
function drawRabbit() {
  ctx.save();
  ctx.translate(rabbit.x, rabbit.y);

  const bounce = Math.sin(rabbit.anim) * 4;
  const joyBounce = rabbit.joy > 0 ? Math.sin(rabbit.joy * Math.PI) * 25 : 0;

  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.beginPath();
  ctx.ellipse(0, rabbit.h/2 + bounce, rabbit.w/2, 16, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = bodyColor;
  ctx.strokeStyle = accentColor;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.roundRect(-rabbit.w/2, -rabbit.h/2 + bounce - joyBounce, rabbit.w, rabbit.h, 40);
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.roundRect(-60, -150 + bounce - joyBounce, 120, 100, 45);
  ctx.fill();
  ctx.stroke();

  if (selectedSkin === "panda" || selectedSkin === "bear") {
    ctx.fillStyle = accentColor;
    ctx.beginPath();
    ctx.arc(-40, -150 + bounce - joyBounce, 20, 0, Math.PI*2);
    ctx.arc(40, -150 + bounce - joyBounce, 20, 0, Math.PI*2);
    ctx.fill();
  } else {
    ctx.fillStyle = "#ffe3f4";
    ctx.beginPath();
    ctx.roundRect(-40, -230 + bounce - joyBounce, 40, 90, 25);
    ctx.roundRect(0, -230 + bounce - joyBounce, 40, 90, 25);
    ctx.fill();
    ctx.stroke();
  }

  ctx.fillStyle = "#333";
  let eyeSize = 12;
  if (selectedSkin === "panda") eyeSize = 14;
  if (selectedSkin === "valentine") eyeSize = 13;

  ctx.beginPath();
  ctx.arc(-25, -110 + bounce - joyBounce, eyeSize, 0, Math.PI*2);
  ctx.arc(25, -110 + bounce - joyBounce, eyeSize, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(-30, -115 + bounce - joyBounce, 4, 0, Math.PI*2);
  ctx.arc(20, -115 + bounce - joyBounce, 4, 0, Math.PI*2);
  ctx.fill();

  const cheekGrad = ctx.createRadialGradient(-40, -90, 2, -40, -90, 20);
  cheekGrad.addColorStop(0, "#ffb3d6");
  cheekGrad.addColorStop(1, "rgba(255,179,214,0)");
  ctx.fillStyle = cheekGrad;
  ctx.beginPath();
  ctx.arc(-40, -90 + bounce - joyBounce, 20, 0, Math.PI*2);
  ctx.fill();

  const cheekGrad2 = ctx.createRadialGradient(40, -90, 2, 40, -90, 20);
  cheekGrad2.addColorStop(0, "#ffb3d6");
  cheekGrad2.addColorStop(1, "rgba(255,179,214,0)");
  ctx.fillStyle = cheekGrad2;
  ctx.beginPath();
  ctx.arc(40, -90 + bounce - joyBounce, 20, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#ff7fb8";
  ctx.beginPath();
  ctx.arc(0, -105 + bounce - joyBounce, 6, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#ffe3f4";
  ctx.beginPath();
  ctx.roundRect(-50, 10 + bounce - joyBounce, 35, 25, 12);
  ctx.roundRect(15, 10 + bounce - joyBounce, 35, 25, 12);
  ctx.fill();
  ctx.stroke();

  if (selectedSkin === "bear") {
    ctx.fillStyle = "#c78b3a";
    ctx.beginPath();
    ctx.roundRect(-35, 45 + bounce - joyBounce, 70, 50, 18);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#ffcc33";
    ctx.beginPath();
    ctx.ellipse(0, 45 + bounce - joyBounce, 30, 12, 0, 0, Math.PI*2);
    ctx.fill();
  } else if (selectedSkin === "panda") {
    ctx.fillStyle = "#ff4f9a";
    ctx.beginPath();
    ctx.moveTo(0, 45 + bounce - joyBounce);
    ctx.bezierCurveTo(-20, 25 + bounce - joyBounce, -35, 45 + bounce - joyBounce, -35, 60 + bounce - joyBounce);
    ctx.bezierCurveTo(-35, 80 + bounce - joyBounce, 0, 90 + bounce - joyBounce, 0, 105 + bounce - joyBounce);
    ctx.bezierCurveTo(0, 90 + bounce - joyBounce, 35, 80 + bounce - joyBounce, 35, 60 + bounce - joyBounce);
    ctx.bezierCurveTo(35, 45 + bounce - joyBounce, 20, 25 + bounce - joyBounce, 0, 45 + bounce - joyBounce);
    ctx.fill();
  } else {
    ctx.fillStyle = "#d8a97b";
    ctx.beginPath();
    ctx.roundRect(-45, 45 + bounce - joyBounce, 90, 50, 18);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#ff9ad5";
    ctx.beginPath();
    ctx.moveTo(0, 45 + bounce - joyBounce);
    ctx.lineTo(-20, 30 + bounce - joyBounce);
    ctx.lineTo(0, 40 + bounce - joyBounce);
    ctx.lineTo(20, 30 + bounce - joyBounce);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();

  if (rabbit.joy > 0) {
    if (selectedSkin === "panda") {
      ctx.fillStyle = "rgba(255,127,184," + rabbit.joy + ")";
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        const x = rabbit.x + i * 25;
        const y = rabbit.y - 180;
        ctx.moveTo(x, y);
        ctx.bezierCurveTo(x - 20, y - 20, x - 40, y + 10, x, y + 30);
        ctx.bezierCurveTo(x + 40, y + 10, x + 20, y - 20, x, y);
        ctx.fill();
      }
    } else if (selectedSkin === "bear") {
      ctx.fillStyle = "rgba(255,204,51," + rabbit.joy + ")";
      ctx.beginPath();
      ctx.ellipse(rabbit.x, rabbit.y - 170, 18, 26, 0, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle = "rgba(255,127,184," + rabbit.joy + ")";
      ctx.beginPath();
      ctx.moveTo(rabbit.x, rabbit.y - 180);
      ctx.bezierCurveTo(rabbit.x - 20, rabbit.y - 200, rabbit.x - 40, rabbit.y - 170, rabbit.x, rabbit.y - 150);
      ctx.bezierCurveTo(rabbit.x + 40, rabbit.y - 170, rabbit.x + 20, rabbit.y - 200, rabbit.x, rabbit.y - 180);
      ctx.fill();
    }
  }
}

// === DRAW ITEMS (včetně pandích srdíček) ===
function drawItems() {
  for (const it of items) {
    const wobbleX = Math.sin(it.wobble) * 6;

    if (selectedSkin === "panda") {
      ctx.fillStyle = it.color;
      const x = it.x + wobbleX;
      const y = it.y;
      const s = it.r * 0.6;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.bezierCurveTo(x - s, y - s, x - 2*s, y + s*0.2, x, y + s*1.4);
      ctx.bezierCurveTo(x + 2*s, y + s*0.2, x + s, y - s, x, y);
      ctx.fill();
      continue;
    }

    if (selectedSkin === "bear") {
      ctx.fillStyle = it.color;
      ctx.beginPath();
      ctx.ellipse(it.x + wobbleX, it.y, it.r * 0.7, it.r, 0, 0, Math.PI * 2);
      ctx.fill();
      continue;
    }

    if (selectedSkin === "valentine") {
      ctx.fillStyle = it.color;
      ctx.beginPath();
      ctx.roundRect(it.x + wobbleX - it.r, it.y - it.r * 0.6, it.r * 2, it.r * 1.2, 6);
      ctx.fill();

      ctx.fillStyle = "#ff4f9a";
      ctx.beginPath();
      ctx.moveTo(it.x + wobbleX, it.y - it.r * 0.2);
      ctx.bezierCurveTo(
        it.x + wobbleX - 10, it.y - it.r * 0.6,
        it.x + wobbleX - 20, it.y,
        it.x + wobbleX, it.y + it.r * 0.4
      );
      ctx.bezierCurveTo(
        it.x + wobbleX + 20, it.y,
        it.x + wobbleX + 10, it.y - it.r * 0.6,
        it.x + wobbleX, it.y - it.r * 0.2
      );
      ctx.fill();
      continue;
    }

    ctx.fillStyle = it.color;
    ctx.beginPath();
    ctx.arc(it.x + wobbleX, it.y, it.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = it.leaf;
    ctx.beginPath();
    ctx.ellipse(it.x + wobbleX - 10, it.y - it.r, 8, 12, Math.PI / 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

// === MAIN LOOP ===
let spawnTimer = 0;

function loop() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();

  updateRabbit();
  updateItems();

  spawnTimer++;
  if (spawnTimer > 60) {
    spawnItem();
    spawnTimer = 0;
  }

  drawRabbit();
  drawItems();

  requestAnimationFrame(loop);
}

// === INIT QUESTS ===
buildQuestPool();
ensureQuests();

// === START ===
loop();
</script>
