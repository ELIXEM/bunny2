<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Králiček 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
  body {
    margin: 0;
    background: radial-gradient(circle at top, #ffe6f7 0%, #ffd1f0 40%, #ffc6e5 70%, #ffb3dd 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: "Comic Sans MS", system-ui;
  }
  canvas {
    border: 8px solid #ff9ad5;
    border-radius: 24px;
    box-shadow: 0 0 35px rgba(255, 150, 200, 0.8);
    width: 100vw;
    height: 100vh;
    touch-action: none;
    background: linear-gradient(#c9f0ff, #ffe9f7);
  }
  #ui {
    position: absolute;
    top: 10px;
    width: 100%;
    text-align: center;
    color: #ff4f9a;
    font-size: 30px;
    font-weight: bold;
    text-shadow: 0 0 8px rgba(255, 150, 200, 0.6);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="ui">Score: <span id="score">0</span></div>
<canvas id="game"></canvas>

<script>
// === canvas setup ===
const canvas = document.getElementById("game");
canvas.width = 540;
canvas.height = 960;
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

// === LOAD SAVED SCORE ===
let score = Number(localStorage.getItem("bunny_score")) || 0;
const scoreEl = document.getElementById("score");
scoreEl.textContent = score;

// === rabbit ===
const rabbit = {
  x: W / 2,
  y: H - 140,
  w: 140,
  h: 120,
  anim: 0,
  joy: 0
};

// === fruit ===
const items = [];
const itemTypes = [
  {color: "#ff6b6b", leaf: "#2ecc71"},
  {color: "#ffd93b", leaf: "#a3e635"},
  {color: "#9bff7b", leaf: "#4ade80"},
  {color: "#ff9ff3", leaf: "#34d399"},
  {color: "#6c5ce7", leaf: "#22c55e"},
  {color: "#00cec9", leaf: "#16a34a"}
];

// === TOUCH CONTROL ===
function handleTouch(evt) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const touch = evt.touches[0];
  const x = (touch.clientX - rect.left) * scaleX;
  rabbit.x = Math.max(rabbit.w / 2, Math.min(W - rabbit.w / 2, x));
}

canvas.addEventListener("touchstart", handleTouch, {passive: true});
canvas.addEventListener("touchmove", handleTouch, {passive: true});

// === spawn fruit ===
function spawnItem() {
  const type = itemTypes[Math.floor(Math.random() * itemTypes.length)];
  items.push({
    x: Math.random() * (W - 40) + 20,
    y: -40,
    r: 30,
    color: type.color,
    leaf: type.leaf,
    vy: 1.2 + Math.random() * 0.6,
    wobble: Math.random() * Math.PI * 2
  });
}

// === update rabbit ===
function updateRabbit() {
  rabbit.anim += 0.05;
  if (rabbit.joy > 0) rabbit.joy -= 0.05;
}

// === update fruit ===
function updateItems() {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy;
    it.wobble += 0.07;

    // collision
    if (
      it.y + it.r > rabbit.y - rabbit.h / 2 &&
      it.x > rabbit.x - rabbit.w / 2 &&
      it.x < rabbit.x + rabbit.w / 2
    ) {
      score++;
      scoreEl.textContent = score;
      rabbit.joy = 1;

      // === SAVE SCORE ===
      localStorage.setItem("bunny_score", score);

      items.splice(i, 1);
      continue;
    }

    if (it.y - it.r > H) {
      items.splice(i, 1);
    }
  }
}

// === background ===
function drawBackground() {
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, "#c9f0ff");
  skyGrad.addColorStop(1, "#ffe9f7");
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  function heart(x, y, s) {
    ctx.fillStyle = "rgba(255,127,184,0.8)";
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.bezierCurveTo(x - 10*s, y - 10*s, x - 20*s, y, x - 20*s, y + 10*s);
    ctx.bezierCurveTo(x - 20*s, y + 20*s, x, y + 25*s, x, y + 35*s);
    ctx.bezierCurveTo(x, y + 25*s, x + 20*s, y + 20*s, x + 20*s, y + 10*s);
    ctx.bezierCurveTo(x + 20*s, y, x + 10*s, y - 10*s, x, y);
    ctx.fill();
  }
  heart(80, 120, 0.7);
  heart(420, 90, 0.6);
  heart(260, 160, 0.5);
}

// === ULTRA‑CUTE RABBIT ===
function drawRabbit() {
  ctx.save();
  ctx.translate(rabbit.x, rabbit.y);

  const bounce = Math.sin(rabbit.anim) * 4;
  const joyBounce = rabbit.joy > 0 ? Math.sin(rabbit.joy * Math.PI) * 25 : 0;

  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.beginPath();
  ctx.ellipse(0, rabbit.h/2 + bounce, rabbit.w/2, 16, 0, 0, Math.PI*2);
  ctx.fill();

  // body
  ctx.fillStyle = "#fff7fb";
  ctx.strokeStyle = "#ff9ad5";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.roundRect(-rabbit.w/2, -rabbit.h/2 + bounce - joyBounce, rabbit.w, rabbit.h, 40);
  ctx.fill();
  ctx.stroke();

  // head
  ctx.beginPath();
  ctx.roundRect(-60, -150 + bounce - joyBounce, 120, 100, 45);
  ctx.fill();
  ctx.stroke();

  // ears
  ctx.fillStyle = "#ffe3f4";
  ctx.beginPath();
  ctx.roundRect(-40, -230 + bounce - joyBounce, 40, 90, 25);
  ctx.roundRect(0, -230 + bounce - joyBounce, 40, 90, 25);
  ctx.fill();
  ctx.stroke();

  // eyes
  ctx.fillStyle = "#333";
  ctx.beginPath();
  ctx.arc(-25, -110 + bounce - joyBounce, 12, 0, Math.PI*2);
  ctx.arc(25, -110 + bounce - joyBounce, 12, 0, Math.PI*2);
  ctx.fill();

  // eye shine
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(-30, -115 + bounce - joyBounce, 4, 0, Math.PI*2);
  ctx.arc(20, -115 + bounce - joyBounce, 4, 0, Math.PI*2);
  ctx.fill();

  // cheeks
  const cheekGrad = ctx.createRadialGradient(-40, -90, 2, -40, -90, 20);
  cheekGrad.addColorStop(0, "#ffb3d6");
  cheekGrad.addColorStop(1, "rgba(255,179,214,0)");
  ctx.fillStyle = cheekGrad;
  ctx.beginPath();
  ctx.arc(-40, -90 + bounce - joyBounce, 20, 0, Math.PI*2);
  ctx.fill();

  const cheekGrad2 = ctx.createRadialGradient(40, -90, 2, 40, -90, 20);
  cheekGrad2.addColorStop(0, "#ffb3d6");
  cheekGrad2.addColorStop(1, "rgba(255,179,214,0)");
  ctx.fillStyle = cheekGrad2;
  ctx.beginPath();
  ctx.arc(40, -90 + bounce - joyBounce, 20, 0, Math.PI*2);
  ctx.fill();

  // nose
  ctx.fillStyle = "#ff7fb8";
  ctx.beginPath();
  ctx.arc(0, -105 + bounce - joyBounce, 6, 0, Math.PI*2);
  ctx.fill();

  // paws
  ctx.fillStyle = "#ffe3f4";
  ctx.beginPath();
  ctx.roundRect(-50, 10 + bounce - joyBounce, 35, 25, 12);
  ctx.roundRect(15, 10 + bounce - joyBounce, 35, 25, 12);
  ctx.fill();
  ctx.stroke();

  // basket
  ctx.fillStyle = "#d8a97b";
  ctx.beginPath();
  ctx.roundRect(-45, 45 + bounce - joyBounce, 90, 50, 18);
  ctx.fill();
  ctx.stroke();

  // bow
  ctx.fillStyle = "#ff9ad5";
  ctx.beginPath();
  ctx.moveTo(0, 45 + bounce - joyBounce);
  ctx.lineTo(-20, 30 + bounce - joyBounce);
  ctx.lineTo(0, 40 + bounce - joyBounce);
  ctx.lineTo(20, 30 + bounce - joyBounce);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  // joy hearts
  if (rabbit.joy > 0) {
    ctx.fillStyle = "rgba(255,127,184," + rabbit.joy + ")";
    ctx.beginPath();
    ctx.moveTo(rabbit.x, rabbit.y - 180);
    ctx.bezierCurveTo(rabbit.x - 20, rabbit.y - 200, rabbit.x - 40, rabbit.y - 170, rabbit.x, rabbit.y - 150);
    ctx.bezierCurveTo(rabbit.x + 40, rabbit.y - 170, rabbit.x + 20, rabbit.y - 200, rabbit.x, rabbit.y - 180);
    ctx.fill();
  }
}

// === draw fruit ===
function drawItems() {
  for (const it of items) {
    const wobbleX = Math.sin(it.wobble) * 6;

    ctx.fillStyle = it.color;
    ctx.beginPath();
    ctx.arc(it.x + wobbleX, it.y, it.r, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = it.leaf;
    ctx.beginPath();
    ctx.ellipse(it.x + wobbleX - 10, it.y - it.r, 8, 12, Math.PI/4, 0, Math.PI*2);
    ctx.fill();
  }
}

// === main loop ===
let spawnTimer = 0;
function loop() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();

  updateRabbit();
  updateItems();

  spawnTimer++;
  if (spawnTimer > 60) {
    spawnItem();
    spawnTimer = 0;
  }

  drawRabbit();
  drawItems();

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
